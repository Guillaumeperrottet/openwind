name: Publish wind tiles

on:
  workflow_dispatch:
  schedule:
    # Away from the top of the hour, where scheduled Actions are more delayed.
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: wind-tiles-production
  cancel-in-progress: false

jobs:
  publish-icon-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIND_TILE_S3_ENDPOINT: ${{ secrets.WIND_TILE_S3_ENDPOINT }}
      WIND_TILE_S3_BUCKET: ${{ secrets.WIND_TILE_S3_BUCKET }}
      WIND_TILE_S3_ACCESS_KEY_ID: ${{ secrets.WIND_TILE_S3_ACCESS_KEY_ID }}
      WIND_TILE_S3_SECRET_ACCESS_KEY: ${{ secrets.WIND_TILE_S3_SECRET_ACCESS_KEY }}
      WIND_TILE_PUBLIC_BASE_URL: ${{ vars.WIND_TILE_PUBLIC_BASE_URL }}
      WIND_TILE_CORS_ORIGIN: https://www.openwind.ch
      WIND_TILE_S3_REGION: ${{ vars.WIND_TILE_S3_REGION || 'auto' }}
      WIND_TILE_S3_PREFIX: ${{ vars.WIND_TILE_S3_PREFIX }}
      WIND_TILE_RETAIN_DATASETS: ${{ vars.WIND_TILE_RETAIN_DATASETS || '12' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-wind.txt

      - name: Check publication configuration
        run: |
          test -n "$WIND_TILE_S3_ENDPOINT"
          test -n "$WIND_TILE_S3_BUCKET"
          test -n "$WIND_TILE_S3_ACCESS_KEY_ID"
          test -n "$WIND_TILE_S3_SECRET_ACCESS_KEY"
          test -n "$WIND_TILE_PUBLIC_BASE_URL"

      - name: Install wind pipeline dependencies
        run: python -m pip install --requirement scripts/requirements-wind.txt

      - name: Build and validate current ICON-EU tiles
        run: |
          python scripts/build-icon-eu-wind-tiles.py \
            --public-base-url "$WIND_TILE_PUBLIC_BASE_URL"

      - name: Publish verified dataset atomically
        run: python scripts/publish_wind_tiles.py
