name: Wind health

on:
  workflow_dispatch:
  schedule:
    # Independent from the publication job (:37) to catch runtime incidents.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: wind-health-production
  cancel-in-progress: true

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WIND_TILE_PUBLIC_BASE_URL: ${{ vars.WIND_TILE_PUBLIC_BASE_URL || 'https://tiles.openwind.ch' }}
      OPENWIND_PRODUCTION_URL: https://www.openwind.ch

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check live manifest, freshness, tile and production API
        run: pnpm wind:health
