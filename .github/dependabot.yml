version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      weekly-batch:
        patterns:
          - "*"
        update-types: [minor, patch]
      major-batch:
        patterns:
          - "*"
        update-types: [major]
      security-batch:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      weekly-actions:
        patterns:
          - "*"
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
